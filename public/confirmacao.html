<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido confirmado | CM4STORE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F5F7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F5F5F7'/><text y='68' x='50' text-anchor='middle' font-size='50' font-family='Helvetica,Arial' font-weight='bold' fill='%237FD000'>C4</text></svg>">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<header class="header scrolled">
  <div class="container">
    <a href="/" class="logo">CM4<b>STORE</b></a>
    <a href="/" class="btn btn-ghost btn-sm">Voltar à loja</a>
  </div>
</header>

<main class="page">
  <div class="container">
    <div class="card confirm-box">
      <div class="confirm-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <span class="eyebrow">Pagamento aprovado</span>
      <h1 class="h2" style="margin:12px 0">Pedido confirmado!</h1>
      <p class="lead" style="margin-inline:auto;text-align:center">Enviamos os detalhes para o seu e-mail. Avisaremos assim que o iPhone 18 chegar na loja.</p>

      <div class="pedido-numero">
        <span>Número do pedido</span>
        <strong id="numeroPedido">—</strong>
      </div>

      <div class="alert alert-info" id="agendaBox" style="text-align:left"></div>

      <div class="confirm-dados" id="dados">
        <div class="dado-linha"><span>Carregando…</span><span></span></div>
      </div>

      <div class="hero-cta" style="justify-content:center;margin-top:var(--s4)">
        <a href="/" class="btn btn-primary">Voltar à loja</a>
        <button class="btn btn-ghost" onclick="window.print()">Imprimir comprovante</button>
      </div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  const numero = params.get('pedido');
  const box = document.getElementById('dados');
  const numeroEl = document.getElementById('numeroPedido');
  const agendaBox = document.getElementById('agendaBox');

  const linha = (k, v) => `<div class="dado-linha"><span>${k}</span><span>${v}</span></div>`;
  const dataBR = (d) => (d ? d.split('-').reverse().join('/') : '—');

  const STATUS_PAGAMENTO = {
    aprovado: 'Aprovado',
    processando: 'Processando',
    pendente: 'Pendente',
    recusado: 'Recusado',
    cancelado: 'Cancelado'
  };

  if (!numero) {
    numeroEl.textContent = '—';
    box.innerHTML = linha('Pedido', 'Não informado');
    return;
  }

  numeroEl.textContent = numero;

  API.pedidos.obter(numero).then(({ data }) => {
    const itens = (data.itens || [])
      .map((i) => `${i.quantidade}x ${i.nome} ${i.cor} ${i.armazenamento}`)
      .join('<br>');
    const ag = data.agendamento;
    const pag = data.pagamento || {};
    const entrega = data.entrega || {};
    const ehEntrega = entrega.tipo === 'entrega';

    numeroEl.textContent = data.numero;

    // Destaque do agendamento
    if (ag) {
      agendaBox.classList.add('on');
      agendaBox.innerHTML = `
        <strong>${ehEntrega ? 'Entrega agendada' : 'Retirada agendada'}</strong><br>
        ${dataBR(ag.data)} às ${ag.hora}${ehEntrega ? '' : ` · ${ag.unidade || 'CM4STORE'}`}
        ${ehEntrega && entrega.endereco ? `<br>${entrega.endereco}, ${entrega.numero || 's/n'}${entrega.bairro ? ' - ' + entrega.bairro : ''}${entrega.cidade ? ' · ' + entrega.cidade : ''}${entrega.uf ? '/' + entrega.uf : ''}` : ''}
      `;
    }

    box.innerHTML = [
      linha('Cliente', data.cliente.nome),
      linha('E-mail', data.cliente.email),
      linha('Telefone', data.cliente.telefone || '—'),
      linha('Itens', itens || '—'),
      linha('Modalidade', ehEntrega ? 'Entrega na região' : 'Retirada na loja'),
      ag ? linha('Data e horário', `<strong>${dataBR(ag.data)} às ${ag.hora}</strong>`) : '',
      ag && !ehEntrega ? linha('Unidade', ag.unidade) : '',
      linha('Forma de pagamento', (pag.metodo || '').toUpperCase() || '—'),
      linha('Status do pagamento', `<strong class="neon">${STATUS_PAGAMENTO[pag.status] || pag.status || '—'}</strong>`),
      pag.transacaoId ? linha('Transação', pag.transacaoId) : '',
      linha('Total pago', `<strong>${window.brl(data.total)}</strong>`)
    ].join('');
  }).catch(() => {
    box.innerHTML = linha('Pedido', `${numero} (não encontrado)`);
  });
})();
</script>
</body>
</html>
